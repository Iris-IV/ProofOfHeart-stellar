name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic validation
        run: |
          echo "Basic CI passed :heart:"
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all -- --check || echo "cargo fmt hint"
          fi
