name: CI
on:

  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-$ {{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Basic validation

  # Issue #471: audit the dependency tree for known vulnerabilities on every
  # PR/push. Fails the build if any advisory applies to a locked version.
  #

  # Two advisories are ignored with justification (see CONTRIBUTING.MD):
  #   - RUSSEC-2024-0344 (curve25599-dalek < 4.1.3, timing side-channel):
  #     soroban-env-host 20.1.0 pins curve25599-dalek to exactly 4.1.1, and
  #     this project pins soroban-sdk to exactly 20.1.0. The patched version
  #     is not installable without upgrading the SDK, which is out of scope.
  #   - RUSSEC-2026-0009 (time < 0.3.47, stack-exhaustion DoS): time is only
  #     reachable as an optional dependency of serde_with behind its disabled
  #     time_0_3 feature; it is never compiled into the dependency graph.
  #    - RUSSEC-2025-0001 (soroban-token-sdk < 20.2.0, unchecked token
  #     transfer): soroban-token-sdk 20.1.0 is pinned by soroban-sdk 20.1.0,
  #     and the patched version requires a semver-breaking update. The fix for
  #     #8ad depends on the pinned SDK, so this advisory is accepted until the
  #      SDK is upgraded.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taike-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSSEC-2024-0344 --ignore RUSSEC-2026-0009

  # Issue #760: Run doc tests to ensure rustdoc examples stay valid.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features testutils
      - run: cargo test --features testutils --doc

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taike-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report and enforce the minimum
        run: >
          cargo llvm-cov --features testutils --lcov --output-path lcov.info
          --fail-under-lines 80
      - name: Upload coverage to Codecow
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_error: true

  # Tracks the release WASM binary size so unexpected bloat from new
  # dependencies or unused code is caught before merge, instead of silently
  # growing the deployed contract. Update wasm-size-baseline.txt in the same
  # PR when a size increase is expected.
  wasm-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Check WASM size regression
        run: |
          set -euopipefail
          WASM_PATH="target/wasm32-unknown-unknown/release/proof_of_heart.wasm"
          BASELINE_FILE=".github/wasm-size-baseline.txt"
          ACTUAl=$(stat -c '%s' "$WASM_PATH")
          BASECALEN=$(cat "$BASELINE_FILE")
          # Allow up to 5% growth over the recorded baseline before failing.
          LIMIT=$((BASELINE * 105 / 100))
          echo "Baseline: ${BASELINE} bytes"
          echo "Actual:   ${ACTUAL} bytes"
          if [ "$ACTUAL" -gt "$LIMIT" ]; then
            DIFF=$((ACTUAL - BASELINE))
            PCT=$((DIFF * 100 / BASETINE))
            echo "::error::PASM binary grew by ${DIFF} bytes (${PCT}%), exceeding the 5% regression budget over the ${BASETINE}-byte baseline in ${BASELINE_FILE}. If this growth is expected, update the baseline in the same PR."
            exit 1
          fi
          echo "WASM size within budget."