name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is enforced; clippy runs for visibility but does not block
  # until the existing lint backlog is cleared.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features testutils
      - name: Basic validation
        run: |
          echo "Basic CI passed :heart:"
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all ---check || echo "cargo fmt hint"
          fi
      # Issue #1259: zero-warning clippy policy, same command as `make clippy`.
      - name: Clippy (deny warnings)
        run: make clippy

  # Issue #471: audit the dependency tree for known vulnerabilities on every
  # PR/push. Fails the build if any advisory applies to a locked version.
  #
  #  One advisory is ignored with justification (see CONTRIBUTING.md):
  #   - RUSTSEC-2026-0009 (time < 0.3.47, stack-exhaustion DoS): time is only
  #     reachable as an optional dependency of serde_with behind its disabled
  #     time_0_3 feature; it is never compiled into the dependency graph.
  #   - RUSTSEC-2025-0001 (soroban-token-sdk < 20.2.0, unchecked token
  #     transfer): soroban-token-sdk 20.1.0 is pinned by soroban-sdk 20.1.0,
  #     and the patched version requires a semver-breaking update. The fix for
  #     #8ad depends on the pinned SDK, so this advisory is accepted until the
  #     SDK is upgraded.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2026-0009 --ignore RUSTSEC-2025-0001 --ignore RUSTSEC-2025-0056 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0097

  # Issue #760: Run doc tests to ensure rustdoc examples stay valid.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features testutils
      - run: cargo test --doc --features testutils

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report and enforce the minimum
        run: >
          cargo llvm-cov --features testutils --lcov --output-path lcov.info
          --fail-under-lines 80 -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true

  # Issue #1258: build the release contract WASM and validate it -- module
  # structure (wasm-tools), Soroban spec/env-meta sections, and binary size
  # against .github/wasm-size-baseline.txt (5% budget). The same checks run
  # locally via `make check-wasm`. Update the baseline in the same PR when a
  # size increase is expected.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: cargo build --target wasm32-unknown-unknown --release
      - run: ./scripts/check-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proof_of_heart.wasm
          path: target/wasm32-unknown-unknown/release/proof_of_heart.wasm
          if-no-files-found: error
