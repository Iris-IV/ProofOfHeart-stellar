name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Issue #403: enforce formatting on every PR.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Issue #403: enforce clippy with -D warnings so unreachable_code and
  # similar lints (see #401) cannot land silently again.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy --all-targets --features testutils -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --features testutils
      - run: cargo build --target wasm32-unknown-unknown --release

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate code coverage
        run: cargo llvm-cov --features testutils --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Don't fail the pipeline if the upload fails (e.g. token not yet configured).
          # The coverage threshold is enforced by `--fail-under-lines 80` above.
          fail_ci_if_error: false
          verbose: true
