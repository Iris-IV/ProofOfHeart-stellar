[package]
name = "proof-of-heart-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.proof-of-heart]
path = ".."
features = ["testutils"]

[patch.crates-io]
# Same vendored ethnum patch as the parent crate (soroban-sdk 20.1.0 pins
# ethnum 1.5.0, which fails to compile on Rust 1.80+). Kept in sync with the
# `[patch.crates-io]` section in ../Cargo.toml.
ethnum = { path = "../vendor/ethnum" }
# Same vendored soroban-env-host patch as the parent crate: fixes the
# ed25519-dalek 3.0.0 CryptoRng incompatibility in the testutils feature.
# Without it the fuzz crate cannot build against soroban-sdk 22.
soroban-env-host = { path = "../vendor/soroban-env-host" }

# Prevent this from interfering with workspace resolution of the library.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_contribute"
path = "fuzz_targets/fuzz_contribute.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_voting"
path = "fuzz_targets/fuzz_voting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lifecycle"
path = "fuzz_targets/fuzz_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_revenue"
path = "fuzz_targets/fuzz_revenue.rs"
test = false
doc = false
bench = false
