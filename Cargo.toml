[package]
name = "proof-of-heart"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# `rlib` is added alongside `cdylib` so the crate can also be depended on as
# an ordinary Rust library -- needed by the `fuzz/` cargo-fuzz harness (#506),
# which links against this crate with the `testutils` feature enabled. This
# has no effect on the `wasm32-unknown-unknown` contract build, which only
# produces the `cdylib` artifact.
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "=22.0.11" }

[dev-dependencies]
derive_arbitrary = "=1.3.2"
proptest = "1"
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[patch.crates-io]
# ethnum is vendored with the upstream fix from ethnum v1.5.3 (a transmute size mismatch with
# TryFromIntError that fails to compile on Rust 1.80+). soroban-sdk 22.0.11 still resolves an
# affected ethnum release, so the patch stays until the SDK depends on ethnum >= 1.5.3 (#1469).
ethnum = { path = "vendor/ethnum" }
# Patch soroban-env-host 22.1.3 testutils to fix ed25519-dalek 3.0.0 CryptoRng incompatibility
soroban-env-host = { path = "vendor/soroban-env-host" }

# Release profile tuned for the smallest possible Soroban WASM (#1170).
#   opt-level = "z"     optimise for size over speed (smaller than "s").
#   codegen-units = 1   one unit lets LLVM inline/dedupe across the whole crate.
#   lto = true          fat LTO drops unreachable SDK code.
#   panic = "abort"     no unwinding tables.
#   strip = "symbols"   no symbol/debug sections in the deployed binary.
#   overflow-checks     deliberately kept ON: money arithmetic must trap.
# These mirror the CARGO_PROFILE_RELEASE_* exports in the Makefile and are
# guarded by scripts/check-wasm.sh (5% budget over .github/wasm-size-baseline.txt).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
