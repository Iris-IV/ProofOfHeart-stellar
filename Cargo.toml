[package]
name = "proof-of-heart"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# `rlib` is added alongside `cdylib` so the crate can also be depended on as
# an ordinary Rust library -- needed by the `fuzz/` cargo-fuzz harness (#506),
# which links against this crate with the `testutils` feature enabled. This
# has no effect on the `wasm32-unknown-unknown` contract build, which only
# produces the `cdylib` artifact.
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "=22.0.11" }

[dev-dependencies]
derive_arbitrary = "=1.3.2"
proptest = "1"
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[patch.crates-io]
# soroban-sdk 20.1.0 pins ethnum 1.5.0, which fails to compile on Rust 1.80+
# due to a transmute size mismatch with TryFromIntError. We vendor the crate and
# apply the upstream fix from ethnum v1.5.3 to restore compatibility.
# TODO: Remove this vendored patch once the project upgrades to a soroban-sdk
# version that depends on ethnum >= 1.5.3 (or drops the exact 1.5.0 pin).
ethnum = { path = "vendor/ethnum" }
# Patch soroban-env-host 22.1.3 testutils to fix ed25519-dalek 3.0.0 CryptoRng incompatibility
soroban-env-host = { path = "vendor/soroban-env-host" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
